<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#170f2b">
  <meta name="description" content="لعبة صح وخطأ جماعية: الكل يشوف السؤال على شاشة وحدة، وكل واحد يجاوب من جواله.">
  <title>صح أو طيح!</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="صح أو طيح">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <style>
    .start { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
    .start-wrap {
      width: min(92vw, 460px);
      padding: calc(28px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center;
    }
    .start-icon {
      width: 120px; height: 120px; border-radius: 28px;
      box-shadow: 0 18px 50px rgba(122, 64, 255, .45), 0 0 0 1px var(--line);
    }
    .start .logo { margin: 6px 0 22px; font-size: 60px; }
    .start-lead { margin: 0; color: var(--mist); font-size: 18px; line-height: 1.6; max-width: 23em; }
    .start-actions { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 12px; }
    .start-card {
      display: block; padding: 18px 22px 20px; border-radius: 24px;
      text-decoration: none; text-align: right; transition: transform .12s ease, box-shadow .12s ease;
    }
    .start-card b { display: block; font-size: 25px; font-weight: 800; line-height: 1.25; }
    .start-card span { display: block; margin-top: 4px; font-size: 15px; line-height: 1.5; }
    .start-card.go-host {
      background: var(--lime); color: var(--ink);
      box-shadow: 0 6px 0 var(--lime-shadow), 0 0 32px rgba(201, 249, 78, .25);
    }
    .start-card.go-host span { color: #3f4c12; }
    .start-card.go-host:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--lime-shadow); }
    .start-card.go-join { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); color: #fff; }
    .start-card.go-join b { color: var(--mint); }
    .start-card.go-join span { color: var(--mist); }
    .start-card.go-join:active { transform: translateY(3px); }
    .start-foot { margin-top: 10px; color: var(--mist); font-size: 14px; }
    @media (prefers-reduced-motion: reduce) { .start-card { transition: none; } }
  </style>
</head>
<body class="start">
  <main class="start-wrap">
    <img class="start-icon" src="/icon-512.png" alt="" width="120" height="120">
    <h1 class="logo" aria-label="صح أو طيح!"><span class="l-true">صح</span><span class="l-or">أو</span><span class="l-fall">طيح!</span></h1>
    <p class="start-lead">الكل يشوف السؤال على شاشة وحدة، وكل واحد يجاوب بالسر من جواله. اللي يغلط يطيح، وآخر واحد يصمد هو الفايز.</p>
    <nav class="start-actions" aria-label="ابدأ">
      <a class="start-card go-host" href="/">
        <b>ابدأ لعبة جديدة</b>
        <span>هالجهاز يصير الشاشة الكبيرة، وربعك يدخلون بالباركود</span>
      </a>
      <a class="start-card go-join" href="/mobile.html">
        <b>ادخل لعبة</b>
        <span>عندك رقم الغرفة؟ اكتبه مع اسمك وادخل</span>
      </a>
    </nav>
    <a class="start-foot" href="/privacy.html">سياسة الخصوصية</a>
  </main>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});</script>
</body>
</html>
