<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#170f2b">
  <title>صح أو طيح! — ما في إنترنت</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      font-family: 'Baloo Bhaijaan 2', 'Segoe UI', Tahoma, system-ui, sans-serif;
      color: #fff; text-align: center;
      background: radial-gradient(70% 55% at 50% 100%, rgba(122, 64, 255, .30), transparent 70%), #170f2b;
    }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { margin: 18px 0 8px; font-size: 30px; }
    p { margin: 0 auto 22px; max-width: 22em; color: #b9aae8; font-size: 18px; line-height: 1.6; }
    button {
      border: 0; border-radius: 999px; padding: .55em 1.8em .65em;
      background: #c9f94e; color: #1a1033; font: inherit; font-size: 20px; font-weight: 800;
      box-shadow: 0 .22em 0 #7e9f1c; cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="">
    <h1>ما في إنترنت</h1>
    <p>اللعبة تحتاج اتصال عشان كل اللاعبين يشوفون نفس السؤال. تأكد من الواي فاي أو البيانات وجرّب مرة ثانية.</p>
    <button type="button" onclick="location.reload()">جرّب مرة ثانية</button>
  </main>
</body>
</html>
